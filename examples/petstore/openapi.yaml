openapi: 3.1.0
info:
    title: Pet Store Example API
    version: 1.0.0
    description: Sample API used to test go-rest-docs OpenAPI generation.
paths:
    /pets:
        get:
            summary: List all pets
            responses:
                "200":
                    description: Response 200
                    content:
                        application/json:
                            schema:
                                items:
                                    properties:
                                        id:
                                            description: Unique pet identifier
                                            type: string
                                        name:
                                            description: Pet's display name
                                            type: string
                                        species:
                                            description: Animal species
                                            type: string
                                    required:
                                        - id
                                        - name
                                        - species
                                    type: object
                                type: array
        post:
            summary: Create a pet
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                name:
                                    description: The pet's name
                                    type: string
                                species:
                                    description: The animal species
                                    type: string
                            required:
                                - name
                                - species
                            type: object
                required: true
            responses:
                "201":
                    description: Response 201
                    content:
                        application/json:
                            schema:
                                properties:
                                    id:
                                        description: The assigned pet ID
                                        type: string
                                    name:
                                        description: The pet's name
                                        type: string
                                    species:
                                        description: The animal species
                                        type: string
                                required:
                                    - id
                                    - name
                                    - species
                                type: object
    /pets/{id}:
        get:
            summary: Get a pet by ID
            parameters:
                - name: id
                  in: path
                  required: true
                  description: The unique pet identifier
                  schema:
                    type: string
            responses:
                "200":
                    description: Response 200
                    content:
                        application/json:
                            schema:
                                properties:
                                    id:
                                        description: Unique pet identifier
                                        type: string
                                    name:
                                        description: Pet's display name
                                        type: string
                                    species:
                                        description: Animal species
                                        type: string
                                required:
                                    - id
                                    - name
                                    - species
                                type: object
    /search:
        get:
            summary: Search pets
            parameters:
                - name: q
                  in: query
                  required: false
                  description: Search query string
                  schema:
                    type: string
            responses:
                "200":
                    description: Response 200
                    content:
                        application/json:
                            schema:
                                properties:
                                    query:
                                        description: The search query that was executed
                                        type: string
                                    results:
                                        description: Matching pets
                                        type: array
                                required:
                                    - query
                                    - results
                                type: object
